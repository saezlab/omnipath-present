# Production/Staging docker-compose
#
# Configure via environment-specific .env files:
#   Staging: docker compose --env-file .env.staging -p omnipath-staging up -d
#   Prod:    docker compose --env-file .env.prod -p omnipath-prod up -d
#
# DATA_DIR must be set to the path of a versioned parquet data directory, e.g.:
#   DATA_DIR=../data/releases/latest  (staging, symlink)
#   DATA_DIR=../data/releases/v-20260225-071916  (prod, pinned)
#
# ONTOLOGY_DIR must be set to the path of OBO ontology files, e.g.:
#   ONTOLOGY_DIR=../omnipath_build/data/silver
#
# GOLD_ROOT_DIR must be set to the root of gold resource zip outputs, e.g.:
#   GOLD_ROOT_DIR=../omnipath_build/data/gold

services:
    postgres:
        build:
            context: ./postgres
            dockerfile: Dockerfile
        environment:
            POSTGRES_DB: omnipath
            POSTGRES_USER: omnipath
            POSTGRES_PASSWORD: omnipath
        ports:
            - "55432:5432"
        shm_size: ${POSTGRES_SHM_SIZE:-2gb}
        # Bulk-load tuning. Defaults are conservative enough for smaller hosts
        # and can be overridden via .env on larger staging/prod machines.
        command:
            - postgres
            - -c
            - max_wal_size=${POSTGRES_MAX_WAL_SIZE:-8GB}
            - -c
            - min_wal_size=${POSTGRES_MIN_WAL_SIZE:-1GB}
            - -c
            - checkpoint_timeout=${POSTGRES_CHECKPOINT_TIMEOUT:-30min}
            - -c
            - checkpoint_completion_target=${POSTGRES_CHECKPOINT_COMPLETION_TARGET:-0.9}
            - -c
            - shared_buffers=${POSTGRES_SHARED_BUFFERS:-512MB}
            - -c
            - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-2GB}
            - -c
            - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-512MB}
            - -c
            - work_mem=${POSTGRES_WORK_MEM:-128MB}
            - -c
            - wal_compression=${POSTGRES_WAL_COMPRESSION:-on}
            - -c
            - synchronous_commit=${POSTGRES_SYNCHRONOUS_COMMIT:-off}
            - -c
            - max_worker_processes=${POSTGRES_MAX_WORKER_PROCESSES:-6}
            - -c
            - max_parallel_workers=${POSTGRES_MAX_PARALLEL_WORKERS:-6}
            - -c
            - max_parallel_workers_per_gather=${POSTGRES_MAX_PARALLEL_WORKERS_PER_GATHER:-3}
            - -c
            - max_parallel_maintenance_workers=${POSTGRES_MAX_PARALLEL_MAINTENANCE_WORKERS:-3}
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U omnipath -d omnipath"]
            interval: 5s
            timeout: 5s
            retries: 20
        volumes:
            - postgres18_data:/var/lib/postgresql
        networks:
            - dokploy-network

    # API Service - FastAPI wrapper for ontograph + graph-native exports
    api-service:
        build:
            context: .
            dockerfile: api-service/Dockerfile.prod
        restart: unless-stopped
        environment:
            ONTOLOGY_DATA_DIR: /data/obo
            OMNIPATH_PARQUET_DIR: /data/parquet
            ONTOLOGY_CACHE_DIR: /app/cache
            OMNIPATH_GOLD_ROOT: /gold
            DATABASE_URL: ${DATABASE_URL_INTERNAL:-postgresql://omnipath:omnipath@postgres:5432/omnipath}
        volumes:
            - ${DATA_DIR:?DATA_DIR must be set}:/data/parquet:ro
            - ${ONTOLOGY_DIR:?ONTOLOGY_DIR must be set}:/data/obo:ro
            - ${GOLD_ROOT_DIR:?GOLD_ROOT_DIR must be set}:/gold:ro
            - ontology_cache:/app/cache
        networks:
            - dokploy-network
        depends_on:
            postgres:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s

    # SvelteKit Frontend
    omnipath-svelte:
        build:
            context: ./omnipath-svelte
            dockerfile: Dockerfile
            args:
                PUBLIC_ENVIRONMENT: ${PUBLIC_ENVIRONMENT:-production}
                PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
                API_SERVICE_URL: http://api-service:8081
                DOCKERIZED: "true"
        restart: unless-stopped
        environment:
            API_SERVICE_URL: http://api-service:8081
            DOCKERIZED: "true"
            OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
            DATABASE_URL: ${DATABASE_URL_INTERNAL:-postgresql://omnipath:omnipath@postgres:5432/omnipath}
            CHAT_MODEL_PROVIDER: ${CHAT_MODEL_PROVIDER:-openrouter}
            OPENROUTER_CHAT_MODEL: ${OPENROUTER_CHAT_MODEL:-gpt-4o}
        ports:
            - "8082:8082"
        networks:
            - dokploy-network
        depends_on:
            postgres:
                condition: service_healthy
            api-service:
                condition: service_healthy

networks:
    dokploy-network:
        external: true

volumes:
    ontology_cache:
        name: ${ONTOLOGY_CACHE_VOLUME_NAME:-omnipath-ontology-cache}
    postgres18_data:
        name: ${POSTGRES_DATA_VOLUME_NAME:-omnipath-postgres18-data}