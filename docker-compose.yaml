# Production/Staging docker-compose
#
# Configure via environment-specific .env files:
#   Staging: docker compose --env-file .env.staging -p omnipath-staging up -d
#   Prod:    docker compose --env-file .env.prod -p omnipath-prod up -d
#
# DATA_DIR must be set to the path of a versioned parquet data directory, e.g.:
#   DATA_DIR=../data/releases/latest  (staging, symlink)
#   DATA_DIR=../data/releases/v-20260225-071916  (prod, pinned)
#
# ONTOLOGY_DIR must be set to the path of OBO ontology files, e.g.:
#   ONTOLOGY_DIR=../omnipath_build/data/silver
#
# GOLD_ROOT_DIR must be set to the root of gold resource zip outputs, e.g.:
#   GOLD_ROOT_DIR=../omnipath_build/data/gold

services:
    omnipathv2-postgres:
        build:
            context: ./postgres
            dockerfile: Dockerfile
        environment:
            POSTGRES_DB: omnipath
            POSTGRES_USER: omnipath
            POSTGRES_PASSWORD: omnipath
        ports:
            - "55432:5432"
        command:
            - postgres
            - -c
            - max_wal_size=8GB
            - -c
            - min_wal_size=1GB
            - -c
            - checkpoint_timeout=15min
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U omnipath -d omnipath"]
            interval: 5s
            timeout: 5s
            retries: 20
        volumes:
            - postgres18_data:/var/lib/postgresql
        networks:
            - dokploy-network

    # API Service - FastAPI wrapper for ontograph + graph-native exports
    api-service:
        build:
            context: .
            dockerfile: api-service/Dockerfile.prod
        restart: unless-stopped
        environment:
            ONTOLOGY_DATA_DIR: /data/obo
            OMNIPATH_PARQUET_DIR: /data/parquet
            ONTOLOGY_CACHE_DIR: /app/cache
            OMNIPATH_GOLD_ROOT: /gold
            DATABASE_URL: postgresql://omnipath:omnipath@omnipathv2-postgres:5432/omnipath
        volumes:
            - ${DATA_DIR:?DATA_DIR must be set}:/data/parquet:ro
            - ${ONTOLOGY_DIR:?ONTOLOGY_DIR must be set}:/data/obo:ro
            - ${GOLD_ROOT_DIR:?GOLD_ROOT_DIR must be set}:/gold:ro
            - ontology_cache:/app/cache
        networks:
            - dokploy-network
        depends_on:
            omnipathv2-postgres:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s

    # SvelteKit Frontend
    omnipath-svelte:
        build:
            context: ./omnipath-svelte
            dockerfile: Dockerfile
            args:
                PUBLIC_ENVIRONMENT: ${PUBLIC_ENVIRONMENT:-production}
                PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
                API_SERVICE_URL: http://api-service:8081
                DOCKERIZED: "true"
        restart: unless-stopped
        environment:
            API_SERVICE_URL: http://api-service:8081
            DOCKERIZED: "true"
            OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
            DATABASE_URL: postgresql://omnipath:omnipath@omnipathv2-postgres:5432/omnipath
            DATABASE_URL_INTERNAL: postgresql://omnipath:omnipath@omnipathv2-postgres:5432/omnipath
            OMNIPATH_PG_SCHEMA: public
            CHAT_MODEL_PROVIDER: ${CHAT_MODEL_PROVIDER:-openrouter}
            OPENROUTER_CHAT_MODEL: ${OPENROUTER_CHAT_MODEL:-gpt-4o}
        ports:
            - "8082:8082"
        networks:
            - dokploy-network
        depends_on:
            omnipathv2-postgres:
                condition: service_healthy
            api-service:
                condition: service_healthy

networks:
    dokploy-network:
        external: true

volumes:
    ontology_cache:
        name: ${ONTOLOGY_CACHE_VOLUME_NAME:-omnipath-ontology-cache}
    postgres18_data:
        name: ${POSTGRES_DATA_VOLUME_NAME:-omnipath-postgres18-data}
