name: Deploy frontend to dev2 + dev3

# Auto-deploys on every push to `main`. To push a change to `main` without
# deploying — e.g., a refactor that needs a coordinated build elsewhere first —
# include `[no-deploy]` (or `[skip-deploy]`) anywhere in the commit message.
#
# `workflow_dispatch` lets you redeploy any ref manually (or rerun a deploy
# that was skipped).
#
# The `deploy` branch is auto-managed: after a successful dev2 + dev3 deploy
# the workflow fast-forwards `deploy` to the just-deployed SHA. The invariant
# is `deploy ≤ main` — humans never push to `deploy` directly. If `deploy`
# diverges (e.g. a force-push to main rewrote history), the next successful
# deploy resets it.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit SHA to deploy (defaults to main)
        required: false

permissions:
  contents: write   # for fast-forwarding the `deploy` branch

jobs:
  decide:
    name: Decide whether to deploy
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      ref: ${{ steps.check.outputs.ref }}
      sha: ${{ steps.check.outputs.sha }}
      short: ${{ steps.check.outputs.short }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - name: Check trigger + commit message
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ github.event.inputs.ref }}
          MSG: ${{ github.event.head_commit.message }}
          DEFAULT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            REF="${INPUT_REF:-main}"
            REASON="manual workflow_dispatch"
            DEPLOY=true
          else
            REF="main"
            # Opt-out marker must be alone on a line (whitespace allowed
            # around it) — so prose mentioning the marker in the body of
            # a commit message doesn't accidentally trigger the skip.
            if printf '%s\n' "$MSG" | grep -qE '^[[:space:]]*\[(no|skip)[-_ ]?deploy\][[:space:]]*$'; then
              DEPLOY=false
              REASON="commit message opts out (contains a [no-deploy] line)"
            else
              DEPLOY=true
              REASON="push to main"
            fi
          fi
          # Use the default SHA for push events; for workflow_dispatch fetch
          # the ref and resolve it.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SHA=$(git ls-remote https://github.com/${{ github.repository }} "$REF" | awk '{print $1}' | head -1)
            [ -z "$SHA" ] && SHA="$REF"
          else
            SHA="$DEFAULT_SHA"
          fi
          SHORT=$(printf '%s' "$SHA" | cut -c1-7)
          echo "should_deploy=$DEPLOY" >> $GITHUB_OUTPUT
          echo "ref=$REF"             >> $GITHUB_OUTPUT
          echo "sha=$SHA"             >> $GITHUB_OUTPUT
          echo "short=$SHORT"         >> $GITHUB_OUTPUT
          echo "reason=$REASON"       >> $GITHUB_OUTPUT
          if [ "$DEPLOY" = "false" ]; then
            echo "::notice::skipping deploy for $REF @ $SHORT — $REASON"
          else
            echo "::notice::deploying $REF @ $SHORT — $REASON"
          fi

  deploy:
    name: Deploy ${{ matrix.instance }}
    needs: decide
    if: needs.decide.outputs.should_deploy == 'true'
    strategy:
      matrix:
        instance: [dev2, dev3, dev4, dev5]
      fail-fast: false
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ matrix.instance }}
      cancel-in-progress: false
    steps:
      - name: Prepare SSH
        env:
          DEPLOY_KEY: ${{ secrets.BEAUTY_OMNIPATH_KEY }}
          KNOWN_HOSTS: ${{ secrets.BEAUTY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 0700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY"  > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Deploy ${{ matrix.instance }}
        env:
          INST: ${{ matrix.instance }}
          REF:  ${{ needs.decide.outputs.ref }}
          SHA:  ${{ needs.decide.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          ssh -p 2323 -o BatchMode=yes omnipath@omnipathdb.org \
              bash -s -- "$INST" "$REF" "$SHA" "$RUN_URL" <<'EOF'
          set -euo pipefail
          INST=$1; REF=$2; SHA=$3; RUN_URL=$4
          LC=/home/omnipath/instances/lockctl
          export LOCKCTL_USER=github-ci

          short() { printf '%s' "${1:0:7}"; }

          status_line=$("$LC" status "$INST" | head -1)
          if printf '%s' "$status_line" | grep -q 'claimed'; then
            holder=$(printf '%s' "$status_line" | sed -n 's/.*holder=\([^ ]*\).*/\1/p')
            if [ "$holder" = "github-ci" ]; then
              echo "::warning::previous CI run on $INST didn't release — overriding"
              "$LC" release "$INST" --force
            else
              echo "::warning::$INST is claimed by $holder — skipping auto-deploy"
              "$LC" status "$INST"
              exit 0
            fi
          fi
          "$LC" claim "$INST" -r "auto-deploy: $REF @ $(short "$SHA") ($RUN_URL)"
          trap '"$LC" release "$INST" --force || true' EXIT

          cd "/home/omnipath/instances/$INST/src"
          git fetch origin --quiet
          git checkout --quiet "$SHA"
          echo "HEAD: $(git log -1 --oneline)"

          make deploy-rebuild-frontend DEPLOY_INSTANCE="$INST"

          "$LC" mark-build "$INST" partial -n "frontend auto-deploy: $REF @ $(short "$SHA")"
          EOF

  advance-deploy-branch:
    name: Fast-forward deploy branch to deployed SHA
    needs: [decide, deploy]
    # Run only when at least one deploy job actually executed and didn't fail.
    # `deploy.result == 'success'` here is the matrix's *aggregate* result —
    # if both dev2 and dev3 succeeded (or skipped via lockctl), we promote.
    if: needs.decide.outputs.should_deploy == 'true' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.decide.outputs.sha }}
          fetch-depth: 1
      - name: Push to deploy
        env:
          SHA: ${{ needs.decide.outputs.sha }}
        run: |
          set -euo pipefail
          # `--force-with-lease` would be ideal but the actions/checkout
          # token doesn't fetch deploy, so we don't know its prior tip.
          # The deploy branch is auto-managed by this workflow — humans
          # don't push to it — so an unconditional fast-forward (or reset)
          # to the just-deployed SHA is safe by construction.
          git push origin "${SHA}:refs/heads/deploy" --force
          echo "::notice::deploy branch fast-forwarded to $SHA"
