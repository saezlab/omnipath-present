# Development docker-compose: Runs backend services only
# Use this with `pnpm dev` in omnipath-svelte for local frontend development
#
# Services read from DATA_DIR (defaults to omnipath_build latest output):
#   DATA_DIR=../omnipath_build/data/combined
#   - entity.parquet, entity_relation.parquet, entity_relation_evidence.parquet
#   - relation_annotation_term.parquet, ontology_term.parquet, resources.parquet
# OBO files for ontology loading come from ONTOLOGY_DIR (silver layer):
#   ONTOLOGY_DIR=../omnipath_build/data/silver

services:
    postgres:
        build:
            context: ..
            dockerfile: omnipath-present/postgres/Dockerfile
        environment:
            POSTGRES_DB: omnipath
            POSTGRES_USER: omnipath
            POSTGRES_PASSWORD: omnipath
        ports:
            - "55432:5432"
        shm_size: ${POSTGRES_SHM_SIZE:-1gb}
        # Bulk-load tuning. Defaults are safe for local development and can be
        # overridden via .env / shell on larger hosts, e.g.
        # POSTGRES_MAX_WAL_SIZE=128GB POSTGRES_SHARED_BUFFERS=32GB docker compose ...
        command:
            - postgres
            - -c
            - max_wal_size=${POSTGRES_MAX_WAL_SIZE:-8GB}
            - -c
            - min_wal_size=${POSTGRES_MIN_WAL_SIZE:-1GB}
            - -c
            - checkpoint_timeout=${POSTGRES_CHECKPOINT_TIMEOUT:-30min}
            - -c
            - checkpoint_completion_target=${POSTGRES_CHECKPOINT_COMPLETION_TARGET:-0.9}
            - -c
            - shared_buffers=${POSTGRES_SHARED_BUFFERS:-512MB}
            - -c
            - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-2GB}
            - -c
            - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-512MB}
            - -c
            - work_mem=${POSTGRES_WORK_MEM:-128MB}
            - -c
            - wal_compression=${POSTGRES_WAL_COMPRESSION:-on}
            - -c
            - synchronous_commit=${POSTGRES_SYNCHRONOUS_COMMIT:-off}
            - -c
            - max_worker_processes=${POSTGRES_MAX_WORKER_PROCESSES:-4}
            - -c
            - max_parallel_workers=${POSTGRES_MAX_PARALLEL_WORKERS:-4}
            - -c
            - max_parallel_workers_per_gather=${POSTGRES_MAX_PARALLEL_WORKERS_PER_GATHER:-2}
            - -c
            - max_parallel_maintenance_workers=${POSTGRES_MAX_PARALLEL_MAINTENANCE_WORKERS:-2}
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U omnipath -d omnipath"]
            interval: 5s
            timeout: 5s
            retries: 20
        volumes:
            - postgres18_data:/var/lib/postgresql

    # API Service - FastAPI wrapper for ontograph + graph-native exports
    api-service:
        build:
            context: ..
            dockerfile: omnipath-present/api-service/Dockerfile
        restart: unless-stopped
        environment:
            ONTOLOGY_DATA_DIR: /data/obo
            OMNIPATH_PARQUET_DIR: /data/parquet
            ONTOLOGY_CACHE_DIR: /app/cache
            OMNIPATH_GOLD_ROOT: /gold
            DATABASE_URL: ${DATABASE_URL_INTERNAL:-postgresql://omnipath:omnipath@postgres:5432/omnipath}
        ports:
            - "8081:8081"
        volumes:
            - ${DATA_DIR:-../omnipath_build/data/combined}:/data/parquet:ro
            - ${ONTOLOGY_DIR:-../omnipath_build/data/silver}:/data/obo:ro
            - ${GOLD_ROOT_DIR:-../omnipath_build/data/gold}:/gold:ro
            - ./api-service/cache:/app/cache
            # Mount source for hot reload during development
            - ./api-service/api_service:/app/api_service
        depends_on:
            postgres:
                condition: service_healthy

volumes:
    ontology_cache:
        name: ${ONTOLOGY_CACHE_VOLUME_NAME:-omnipath-ontology-cache}
    postgres18_data:
        name: ${POSTGRES_DATA_VOLUME_NAME:-omnipath-postgres18-data}