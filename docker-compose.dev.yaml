# Development docker-compose: Runs backend services only
# Use this with `npm run dev` in next-omnipath for local frontend development
#
# Services read from DATA_DIR (defaults to omnipath_build latest output):
#   DATA_DIR=../omnipath_build/data/combined
#   - entity.parquet, entity_relation.parquet, entity_relation_evidence.parquet
#   - relation_annotation_term.parquet, ontology_term.parquet, resources.parquet

services:
    # API Service - FastAPI wrapper for ontograph + graph-native exports
    api-service:
        build:
            context: ..
            dockerfile: omnipath-present/api-service/Dockerfile
        restart: unless-stopped
        environment:
            ONTOLOGY_DATA_DIR: /data
            ONTOLOGY_CACHE_DIR: /app/cache
            OMNIPATH_GOLD_ROOT: /gold
            MEILISEARCH_HOST: http://omnipath-meilisearch:7700
            MEILISEARCH_API_KEY: ${MEILISEARCH_API_KEY:-devkey123}
            DATABASE_URL: ${DATABASE_URL:-postgresql://localhost:5432/omnipath}
        ports:
            - "8081:8081"
        volumes:
            - ${DATA_DIR:-../omnipath_build/data/combined}:/data:ro
            - ${GOLD_ROOT_DIR:-../omnipath_build/data/gold}:/gold:ro
            - ./api-service/cache:/app/cache
            # Mount source for hot reload during development
            - ./api-service/api_service:/app/api_service