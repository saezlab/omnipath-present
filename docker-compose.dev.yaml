# Development docker-compose: Runs backend services only
# Use this with `npm run dev` in next-omnipath for local frontend development
#
# Services read from DATA_DIR (defaults to omnipath_build latest output):
#   DATA_DIR=../omnipath_build/data/latest/output
#   - entity_identifier.parquet  (entity-service)
#   - omnipath_mi.obo            (ontology-service)
#   - search_*.parquet           (ontology-service export endpoints)
#   - .data_version              (optional version marker)

services:
    # Meilisearch - Full-text search engine
    # NOTE: Data is populated by omnipath_build (direct import), not by omnipath-present.
    omnipath-meilisearch:
        image: getmeili/meilisearch:v1.36
        restart: unless-stopped
        ulimits:
            nofile:
                soft: 65535
                hard: 65535
        environment:
            MEILI_MASTER_KEY: ${MEILISEARCH_API_KEY:-devkey123}
            MEILI_ENV: ${MEILI_ENV:-development}
            MEILI_NO_ANALYTICS: "true"
        volumes:
            - meilisearch_data:/meili_data
        ports:
            - "7700:7700"
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
            interval: 30s
            timeout: 30s
            retries: 20
            start_period: 15m

    # Entity Service - Parquet-based entity lookup
    entity-service:
        build:
            context: ./entity-service
            dockerfile: Dockerfile
        restart: unless-stopped
        environment:
            ENTITY_PARQUET_PATH: /data/entity_identifier.parquet
            BIND_ADDR: 0.0.0.0:8080
            RUST_LOG: ${RUST_LOG:-debug}
        ports:
            - "8080:8080"
        volumes:
            - ${DATA_DIR:-../omnipath_build/data/latest/output}:/data:ro
        healthcheck:
            test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s

    # Ontology Service - FastAPI wrapper for ontograph
    ontology-service:
        build:
            context: ..
            dockerfile: omnipath-present/ontology-service/Dockerfile
        restart: unless-stopped
        environment:
            ONTOLOGY_DATA_DIR: /data
            ONTOLOGY_CACHE_DIR: /app/cache
            MEILISEARCH_HOST: http://omnipath-meilisearch:7700
            MEILISEARCH_API_KEY: ${MEILISEARCH_API_KEY:-devkey123}
        ports:
            - "8081:8081"
        volumes:
            - ${DATA_DIR:-../omnipath_build/data/latest/output}:/data:ro
            - ./ontology-service/cache:/app/cache
            # Mount source for hot reload during development
            - ./ontology-service/ontology_service:/app/ontology_service

volumes:
    meilisearch_data:
        external: true
        name: omnipath_build_meilisearch_data
