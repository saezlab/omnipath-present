# Development docker-compose: runs backend services only.
# Prefer `make dev`, which starts these services and then runs the SvelteKit
# frontend from omnipath-svelte.
#
# Active graph/search data comes from Postgres. The API service also mounts
# local OBO files from a sibling omnipath-build checkout for ontology lookup:
#   ONTOLOGY_DIR=../omnipath-build/data/obo
# DATA_DIR and GOLD_ROOT_DIR are still mounted for legacy/archive code paths.

services:
    omnipathv2-postgres:
        build:
            context: ..
            dockerfile: omnipath-present/postgres/Dockerfile
        environment:
            POSTGRES_DB: omnipath
            POSTGRES_USER: omnipath
            POSTGRES_PASSWORD: omnipath
        ports:
            - "55432:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U omnipath -d omnipath"]
            interval: 5s
            timeout: 5s
            retries: 20
        volumes:
            - postgres18_data:/var/lib/postgresql

    # API Service - FastAPI wrapper for ontograph + graph-native exports
    api-service:
        build:
            context: ..
            dockerfile: omnipath-present/api-service/Dockerfile
        restart: unless-stopped
        environment:
            ONTOLOGY_DATA_DIR: /data/obo
            OMNIPATH_PARQUET_DIR: /data/parquet
            ONTOLOGY_CACHE_DIR: /app/cache
            OMNIPATH_GOLD_ROOT: /gold
            DATABASE_URL: postgresql://omnipath:omnipath@omnipathv2-postgres:5432/omnipath
        ports:
            - "8081:8081"
        volumes:
            - ${DATA_DIR:-../omnipath-build/data/combined/latest}:/data/parquet:ro
            - ${ONTOLOGY_DIR:-../omnipath-build/data/obo}:/data/obo:ro
            - ${GOLD_ROOT_DIR:-../omnipath-build/data/gold}:/gold:ro
            - ./api-service/cache:/app/cache
            # Mount source for hot reload during development
            - ./api-service/api_service:/app/api_service
        depends_on:
            omnipathv2-postgres:
                condition: service_healthy

volumes:
    ontology_cache:
        name: ${ONTOLOGY_CACHE_VOLUME_NAME:-omnipath-ontology-cache}
    postgres18_data:
        name: ${POSTGRES_DATA_VOLUME_NAME:-omnipath-postgres18-data}
