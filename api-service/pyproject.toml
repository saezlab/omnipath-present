[project]
name = "api-service"
version = "0.1.0"
description = "REST API for querying biological ontologies"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0.0",
    "httpx>=0.28.0",
    "polars>=1.0.0",
    "ontograph",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",  # For testing async FastAPI
]

[tool.uv.sources]
ontograph = { git = "https://github.com/saezlab/ontograph.git", branch = "main" }

[tool.hatch.build.targets.wheel]
packages = ["api_service"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
